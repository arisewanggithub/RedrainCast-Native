name: Build and publish unified FFmpeg runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redraincast-ffmpeg-unified-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate scripts and package contract
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests
          bash -n scripts/build.sh
          shellcheck scripts/build.sh
      - name: Require unused release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'from scripts.common import SPEC; print(SPEC["tag"])')"
          windows_tag="$(python3 -c 'import json; print(json.load(open("windows.json"))["tag"])')"
          test "$tag" = "$windows_tag"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python3 - "$tag" <<'PY'
          import json, sys
          assert not any(r["tag_name"] == sys.argv[1] for r in json.load(open("/tmp/releases.json"))), "Release already exists"
          PY
          test -z "$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
      - name: Build, inspect ELF and smoke-link
        run: bash scripts/build.sh "${{ matrix.abi }}" "$ANDROID_HOME/ndk/27.2.12479018"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.abi }}
          path: /tmp/redrain-ffmpeg/stage/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: out/staging
          merge-multiple: true
      - name: Merge deterministic AAR
        run: |
          python3 scripts/package.py --staging out/staging --out out/dist --commit "$GITHUB_SHA"
          python3 scripts/package.py --staging out/staging --out out/repeat --commit "$GITHUB_SHA"
          cmp out/dist/*.aar out/repeat/*.aar
      - name: Validate Google Prefab schema and real CMake targets
        run: |
          set -euo pipefail
          artifact="$(python3 -c 'from scripts.common import SPEC; print(SPEC["artifact"])')"
          version="$(python3 -c 'from scripts.common import SPEC; print(SPEC["version"])')"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          curl --fail --location --retry 3 \
            https://dl.google.com/dl/android/maven2/com/google/prefab/cli/2.1.0/cli-2.1.0-all.jar \
            -o /tmp/prefab.jar
          echo 'e219c8cd6bfd9ff71503a57c6af34b9ba060f03525cc3e58330dee53245a5ed6  /tmp/prefab.jar' | sha256sum -c -
          python3 scripts/validate_consumer.py \
            --aar "out/dist/$artifact-$version.aar" \
            --ndk "$ANDROID_HOME/ndk/27.2.12479018" --prefab-cli /tmp/prefab.jar \
            --work /tmp/prefab-consumer --report out/dist/consumer-validation.json
      - name: Assemble corresponding source, rebuild materials and licenses
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ffmpeg.org/releases/ffmpeg-7.1.3.tar.xz \
            -o out/dist/ffmpeg-7.1.3.tar.xz
          tag="$(python3 -c 'from scripts.common import SPEC; print(SPEC["tag"])')"
          git archive --format=tar HEAD | gzip -n > "out/dist/$tag-build-materials.tar.gz"
          python3 scripts/release_assets.py --dist out/dist
          (cd out/dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: out/dist/
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: windows-11-vs2026-arm
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-toolchain
          - architecture: x64
            runner: windows-2025
            msystem: MINGW64
            packages: mingw-w64-x86_64-toolchain
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            nasm
            python
            ${{ matrix.packages }}
      - name: Build, validate configuration and smoke-test decoders
        shell: msys2 {0}
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/build_windows.py "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.architecture }}
          path: out/windows-build/stage/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 7

  package-windows:
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-*
          path: out/staging
          merge-multiple: false
      - name: Validate staged DLLs and assemble deterministic packages
        run: |
          mv out/staging/windows-arm64 out/staging/arm64
          mv out/staging/windows-x64 out/staging/x64
          python3 scripts/package_windows.py --staging out/staging --out out/dist
          python3 scripts/package_windows.py --staging out/staging --out out/repeat
          for archive in out/dist/*.zip; do
            cmp "$archive" "out/repeat/$(basename "$archive")"
          done
      - name: Attach pinned source and exact build materials
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ffmpeg.org/releases/ffmpeg-7.1.3.tar.xz \
            -o out/dist/ffmpeg-7.1.3.tar.xz
          echo 'f0bf043299db9e3caacb435a712fc541fbb07df613c4b893e8b77e67baf3adbe  out/dist/ffmpeg-7.1.3.tar.xz' | sha256sum -c -
          artifact="$(python3 -c 'import json; print(json.load(open("windows.json"))["artifact"])')"
          version="$(python3 -c 'import json; print(json.load(open("windows.json"))["version"])')"
          git archive --format=tar HEAD | gzip -n > "out/dist/$artifact-$version-build-materials.tar.gz"
          (cd out/dist && sha256sum *.zip *.tar.xz *.tar.gz > SHA256SUMS)
          (cd out/dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-assets
          path: out/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [package, package-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: out/android
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-assets
          path: out/windows
      - name: Verify and combine both platform packages
        run: |
          set -euo pipefail
          (cd out/android && sha256sum -c SHA256SUMS)
          (cd out/windows && sha256sum -c SHA256SUMS)
          cmp out/android/ffmpeg-7.1.3.tar.xz out/windows/ffmpeg-7.1.3.tar.xz
          mkdir -p out/dist
          cp -a out/android/. out/dist/
          mv out/dist/SHA256SUMS out/dist/android-SHA256SUMS
          cp -a out/windows/. out/dist/
          mv out/dist/SHA256SUMS out/dist/windows-SHA256SUMS
          (cd out/dist && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish one immutable release containing both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'from scripts.common import SPEC; print(SPEC["tag"])')"
          version="$(python3 -c 'from scripts.common import SPEC; print(SPEC["version"])')"
          android_asset="$(python3 -c 'from scripts.common import SPEC, aar_filename; print(aar_filename())')"
          windows_artifact="$(python3 -c 'import json; print(json.load(open("windows.json"))["artifact"])')"
          windows_version="$(python3 -c 'import json; print(json.load(open("windows.json"))["version"])')"
          (cd out/dist && sha256sum -c SHA256SUMS)
          test -z "$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python3 - "$tag" "$android_asset" "${windows_artifact}-arm64-${windows_version}.zip" "${windows_artifact}-x64-${windows_version}.zip" <<'PY'
          import json, sys
          assert not any(r["tag_name"] == sys.argv[1] for r in json.load(open("/tmp/releases.json"))), "Release already exists (including draft)"
          PY
          cat > /tmp/notes.txt <<EOF
          Unified RedrainCast FFmpeg 7.1.3 native packages, LGPL-2.1-or-later.

          Android: arm64-v8a, armeabi-v7a, x86_64; minimum API 30.
          Windows: ARM64 and x64 shared decoder/audio runtimes.
          Each platform's package, source, build materials, provenance and checksums are included.

          Both platform builds and their consumer/package validation passed before publication.
          Application distributors must separately satisfy LGPL relinking obligations.

          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Commit: $GITHUB_SHA
          EOF
          gh release create "$tag" out/dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "RedrainCast FFmpeg $version (Android + Windows)" --notes-file /tmp/notes.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > /tmp/release.json
          python3 - "$tag" "$android_asset" "${windows_artifact}-arm64-${windows_version}.zip" "${windows_artifact}-x64-${windows_version}.zip" <<'PY'
          import json, sys
          release = json.load(open("/tmp/release.json"))
          assert release["tag_name"] == sys.argv[1]
          assert release["draft"] is False
          assert release["immutable"] is True
          names = {asset["name"] for asset in release["assets"]}
          assert sys.argv[2] in names
          assert sys.argv[3] in names
          assert sys.argv[4] in names
          assert "SHA256SUMS" in names
          PY
